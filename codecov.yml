codecov:
  notify:
    after_n_builds: 17

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      fuzz:
        target: auto
        threshold: 1%
        flags:
          - fuzz
      tests:
        target: auto
        threshold: 1%
        flags:
          - tests

flags:
  fuzz:
    after_n_builds: 12
  tests:
    after_n_builds: 5

comment: false
