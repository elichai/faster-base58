coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
      fuzz:
        target: auto
        threshold: 1%
        flags:
          - fuzz
      tests:
        target: auto
        threshold: 1%
        flags:
          - tests

flags:
  fuzz:
    after_n_builds: 8
  tests:
    after_n_builds: 8

comment: false
