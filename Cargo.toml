[package]
name = "faster-base58"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast Bitcoin Base58 encoding and decoding with automatic CPU dispatch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elichai/faster-base58"
readme = "README.md"
keywords = ["base58", "encoding", "no-std", "serialization"]
categories = ["encoding", "no-std"]
include = [
    "/src/**", "/tests/**/*.rs", "/benches/*.rs",
    "/README.md", "/DESIGN.md", "/LICENSE-*",
    "/assets/graphs/*.svg", "/docs/performance.md", "/docs/review/production*.md",
]

[features]
default = []
std = []
# Opt in to process-wide matrix tables and bounded NTT twiddle retention.
cache = ["std"]
# Unstable hooks for this repository's tests and measurement tools.
__internals = []

[target.'cfg(target_arch = "x86_64")'.dependencies]
# OS-aware runtime detection without std or handwritten CPUID/XGETBV code.
cpufeatures = "0.3.1"

[dev-dependencies]
basexx = "0.2.0"
bs58 = "0.5.1"
criterion = "0.8.2"
five8 = "1.0.0"
malachite-base = "0.14.0"
malachite-nz = "0.14.0"
proptest = "1.9.0"
rand_xoshiro = "0.8.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[package.metadata.kani.flags]
default-unwind = "1"

[[test]]
name = "properties"
required-features = ["__internals"]

[[test]]
name = "miri"
required-features = ["__internals"]

[[bench]]
name = "decode"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode_matrix_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "dispatch"
harness = false
required-features = ["__internals"]

# Unit tests compare against quadratic bs58 at benchmark sizes, so optimize debug
# builds. Overflow checks and debug assertions stay on.
[profile.dev]
opt-level = 3

# The README's numbers use fat LTO, so every machine builds benchmarks alike
# (`cargo bench` inherits this profile).
[profile.release]
lto = "fat"
