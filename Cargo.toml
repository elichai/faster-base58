[package]
name = "faster-base58"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Fast Bitcoin Base58 encoding and decoding with automatic CPU dispatch"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elichai/faster-base58"
readme = "README.md"
keywords = ["base58", "encoding", "no-std", "bitcoin"]
categories = ["encoding", "no-std", "no-std::no-alloc", "cryptography::cryptocurrencies"]
include = [
    "/src/**", "/tests/**/*.rs", "/benches/*.rs",
    "/README.md", "/DESIGN.md", "/CORRECTNESS.md", "/REFERENCES.md", "/LICENSE-*",
    "/assets/graphs/m5-public.svg", "/assets/graphs/gcp-public.svg",
    "/assets/graphs/wasm-public.svg", "/docs/README.md", "/docs/performance.md",
    "/licenses/*.txt",
]

[features]
default = ["alloc"]
alloc = []
std = []
check = ["dep:sha2"]
# Opt in to process-wide matrix tables and bounded NTT twiddle retention.
cache = ["alloc", "std"]
# Use smaller x86 IFMA windows to reduce linked code.
compact = []
# Unstable hooks for this repository's tests and measurement tools.
__internals = ["alloc"]

[dependencies]
sha2 = { version = "0.11", optional = true, default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Used only without std; Cargo's additive features keep this dependency resolved.
cpufeatures = "0.3.1"

[dev-dependencies]
basexx = "0.2.0"
bs58 = { version = "0.5.1", features = ["check"] }
five8 = "1.0.0"
malachite-base = "0.14.0"
malachite-nz = "0.14.0"
rand_xoshiro = "0.8.1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8.2"
proptest = "1.9.0"

# Lets the unit tests run under a WASI engine: proptest's default `fork` does not build
# there, and the benches are native only.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
proptest = { version = "1.9.0", default-features = false, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
chunks_exact_to_as_chunks = "warn"
doc_markdown = "warn"
ignore_without_reason = "warn"
manual_assert_eq = "warn"
missing_errors_doc = "warn"
must_use_candidate = "warn"
or_fun_call = "warn"
precedence_bits = "warn"
should_panic_without_expect = "warn"
undocumented_unsafe_blocks = "warn"

[package.metadata.kani.flags]
default-unwind = "1"

# `__internals` would publish unstable docs; `cache` adds no public items.
[package.metadata.docs.rs]
features = ["check"]
rustdoc-args = ["--cfg", "docsrs"]

[[test]]
name = "properties"
required-features = ["__internals"]

[[test]]
name = "miri"
required-features = ["__internals"]

[[bench]]
name = "decode"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "encode_matrix_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "radix_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "dispatch"
harness = false
required-features = ["__internals"]

[[bench]]
name = "threshold_tune"
harness = false
required-features = ["__internals"]

[[bench]]
name = "check"
harness = false
required-features = ["check"]

# Unit tests compare against quadratic bs58 at benchmark sizes, so optimize debug
# builds. Overflow checks and debug assertions stay on.
[profile.dev]
opt-level = 3

# The README's numbers use fat LTO, so every machine builds benchmarks alike
# (`cargo bench` inherits this profile).
[profile.release]
lto = "fat"
