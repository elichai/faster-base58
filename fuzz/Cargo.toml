[package]
name = "faster-base58-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
cache = ["faster-base58/cache"]
compact = ["faster-base58/compact"]
# Keep the slower structured target out of general build/replay lanes.
full-width = []

[dependencies]
faster-base58 = { path = "..", features = ["__internals"] }
bs58 = "0.5.1"
libfuzzer-sys = "0.4"
malachite-nz = "0.14.0"

[[bin]]
name = "encode_all"
path = "fuzz_targets/encode_all.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_all"
path = "fuzz_targets/decode_all.rs"
test = false
doc = false
bench = false

[[bin]]
name = "encode_full_width"
path = "fuzz_targets/encode_full_width.rs"
required-features = ["full-width"]
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
overflow-checks = true
