name: Cache Cargo sources

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-cargo-sources-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/git/checkouts
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/registry/src
          key: cargo-sources-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'tools/resource-profile/Cargo.lock') }}
      - run: cargo +stable fetch --locked
      - run: cargo +stable fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo +stable fetch --locked --manifest-path tools/resource-profile/Cargo.toml
