name: Miri Nextest benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miri-nextest-benchmark-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  stock_miri:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cargo-test, command: test }
          - { name: nextest-2, command: 'nextest run -j2' }
          - { name: nextest-4, command: 'nextest run -j4' }
    env:
      RUSTFLAGS: -C target-cpu=x86-64 -C target-feature=+avx2
      MIRIFLAGS: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/cache-cargo-sources
      - if: matrix.name != 'cargo-test'
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.150
      - run: rustup toolchain install nightly-2026-10-26 --component miri --profile minimal
      - run: cargo +nightly-2026-10-26 miri setup --target x86_64-unknown-linux-gnu
      - name: Run stock Miri selection
        run: |
          set -e -o pipefail
          start=$SECONDS
          cargo +nightly-2026-10-26 miri ${{ matrix.command }} --target x86_64-unknown-linux-gnu --locked --features __internals --test miri
          cargo +nightly-2026-10-26 miri ${{ matrix.command }} --target x86_64-unknown-linux-gnu --locked --test tiny_inputs
          cargo +nightly-2026-10-26 miri ${{ matrix.command }} --target x86_64-unknown-linux-gnu --locked --lib miri_tests::
          cargo +nightly-2026-10-26 miri ${{ matrix.command }} --target x86_64-unknown-linux-gnu --locked --lib matrix::x86::tests::kernels_match_portable -- --exact
          MIRIFLAGS='-Zmiri-strict-provenance -Zmiri-tree-borrows -Zmiri-seed=1' cargo +nightly-2026-10-26 miri ${{ matrix.command }} --target x86_64-unknown-linux-gnu --locked --lib miri_tests::
          printf 'variant=%s\nelapsed_seconds=%s\n' '${{ matrix.name }}' "$((SECONDS - start))" | tee "$RUNNER_TEMP/miri-nextest-benchmark.txt"
          nproc | sed 's/^/runner_cores=/' | tee -a "$RUNNER_TEMP/miri-nextest-benchmark.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: miri-nextest-${{ matrix.name }}
          path: ${{ runner.temp }}/miri-nextest-benchmark.txt
          if-no-files-found: error
          retention-days: 14
