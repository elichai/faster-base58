name: Release-plz PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-plz-pr:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustc -vV
      - uses: release-plz/action@7ef5e4d4b0420630cfcaeb182c01e13651d4c577 # v0.5.145
        with:
          command: release-pr
        env:
          # shortcut: token-authored release PRs skip CI, close/reopen them to run checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
