version: 2
updates:
  # The stable toolchain (rust-toolchain.toml) and the nightly (ci/nightly).
  - package-ecosystem: rust-toolchain
    directories: ["/", "/ci/nightly"]
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directories: ["/", "/fuzz", "/tools/resource-profile"]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
