[package]
name = "resource-profile"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["bs58", "five8"]
count-allocations = []
cache = ["faster-base58/cache"]
compact = ["faster-base58/compact"]
bs58 = ["dep:bs58"]
five8 = ["dep:five8"]

[dependencies]
faster-base58 = { path = "../..", features = ["__internals"] }
bs58 = { version = "=0.5.1", optional = true }
five8 = { version = "=1.0.0", optional = true }
malachite-base = "=0.14.0"
malachite-nz = "=0.14.0"

[profile.release]
lto = "fat"

[lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
undocumented_unsafe_blocks = "warn"
